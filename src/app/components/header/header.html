<header class="header">
  <div class="header__inner">
    <a routerLink="/" class="header__logo">🎬 {{ logoTitle }}</a>
    <nav class="header__nav">
      @for (link of navLinks; track link.path) {
        <a
          routerLink="{{ link.path }}"
          routerLinkActive="active"
          class="header__link"
        >
          {{ link.title }}
        </a>
      }
    </nav>
  </div>
</header>
